[project]
name = "finsight-core"
version = "0.1.0"
description = "FinSight shared core library — data models, PageIndex navigation, financial calculations"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight_core"]
